[package]
name = "financial_projects"
version = "0.1.0"
edition = "2021"

[dependencies]
# Data fetching
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }

# Data processing
polars = { version = "0.37", features = ["lazy", "csv", "parquet", "dtype-datetime", "dtype-date", "serde", "temporal"] }
anyhow = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Plotting (optional)
plotters = "0.3"

[dev-dependencies]
criterion = "0.5"