[package]
name = "financial_projects"
version = "0.6.0"
edition = "2021"

[dependencies]
# Data fetching
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }

# Data processing
polars = { version = "0.37", default-features = false, features = ["parquet", "dtype-datetime", "dtype-date", "temporal"] }
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0
